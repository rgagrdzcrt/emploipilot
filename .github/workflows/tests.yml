name: Tests
# Vérifie à chaque envoi que les règles de tri et le site se chargent toujours :
# aucun réseau, aucun secret, rien n'est écrit dans le dépôt.
on:
  push:
    branches: ['**']
    paths-ignore: ['offres.json', 'stats.json', 'lieux.json']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Règles de la collecte (Python)
        run: python -m unittest discover -s tests -v
      - name: Syntaxe des scripts du site
        run: for f in *.js; do node --check "$f"; done
      - name: Règles du site (JavaScript)
        run: node --test tests/front.test.js
