name: Collecte des offres
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collecte-offres
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecter les flux autorisés
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          WORKOPIA_CLIENT_ID: ${{ secrets.WORKOPIA_CLIENT_ID }}
          WORKOPIA_REFRESH_TOKEN: ${{ secrets.WORKOPIA_REFRESH_TOKEN }}
        run: python collect.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offres.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des offres collectées"
            # Un commit a pu être poussé pendant la collecte : on s'aligne avant d'envoyer.
            git pull --rebase
            git push
          else
            echo "Aucun changement à enregistrer."
          fi
