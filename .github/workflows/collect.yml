name: Collecte des offres
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collecte-offres
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les flux autorisés
        run: python scripts/collect.py
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offres.json
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des offres collectées"
            git push
          else
            echo "Aucun changement à enregistrer."
          fi
