name: Collecte des offres
on:
  schedule:
    - cron: '7 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collecte-offres
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          # Toujours la dernière version : une collecte en attente (GitHub en
          # déclenche parfois deux à la fois) repart des offres déjà enregistrées.
          ref: main
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collecter les flux autorisés
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          WORKOPIA_CLIENT_ID: ${{ secrets.WORKOPIA_CLIENT_ID }}
          WORKOPIA_REFRESH_TOKEN: ${{ secrets.WORKOPIA_REFRESH_TOKEN }}
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: python collect.py

      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offres.json
          if [ -f lieux.json ]; then git add lieux.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des offres collectées"
            # Un commit a pu être poussé pendant la collecte : on s'aligne avant d'envoyer.
            if ! git pull --rebase; then
              # Une autre collecte vient d'enregistrer les offres : on lui laisse
              # la place (sans erreur ni alerte en double), la suivante reprendra.
              git rebase --abort
              rm -f .alerte.json
              echo "Collecte concurrente déjà enregistrée : celle-ci est ignorée."
              exit 0
            fi
            git push
          else
            echo "Aucun changement à enregistrer."
          fi

      - name: Envoyer l'alerte des nouvelles offres
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # Laisse à GitHub Pages le temps de publier la mise à jour avant l'alerte.
          if [ -f .alerte.json ] && [ -n "$NTFY_TOPIC" ]; then sleep 60; fi
          python collect.py --alerte
