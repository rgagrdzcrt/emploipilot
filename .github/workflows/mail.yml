name: Tri des e-mails
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      jours:
        description: 'E-mails des N derniers jours'
        default: '3'
      essai:
        description: 'Mode essai (ne rien modifier)'
        type: boolean
        default: false
      reclasser:
        description: 'Reclasser les e-mails déjà libellés (après un changement de règles)'
        type: boolean
        default: false
permissions:
  contents: read
  actions: write   # relance de la collecte en retard (dernière étape)
concurrency:
  group: tri-emails
  cancel-in-progress: false
jobs:
  tri:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Le dépôt est public : le script n'écrit rien dans le dépôt et
      # n'affiche que des compteurs (ni expéditeur ni objet).
      - name: Trier les e-mails
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ZCRT_GIST_TOKEN: ${{ secrets.ZCRT_GIST_TOKEN }}
          ZCRT_GIST_ID: ${{ secrets.ZCRT_GIST_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOURS: ${{ inputs.jours || '3' }}
          ESSAI: ${{ inputs.essai && '--essai' || '' }}
          RECLASSER: ${{ inputs.reclasser && '--reclasser' || '' }}
        run: python mail.py --jours "$JOURS" $ESSAI $RECLASSER

      # GitHub saute souvent les tâches planifiées (constaté en novembre 2026 : environ
      # 2 collectes sur 4 par jour). Chaque tri planifié relance donc la collecte si la
      # dernière date de plus de 5 h. Une relance manuelle ne relance rien : pas de boucle.
      - name: Relancer la collecte si elle a pris du retard
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w collect.yml -L 1 --json createdAt -q '.[0].createdAt')
          age=$(( $(date +%s) - $(date -d "${last:-1970-01-01T00:00:00Z}" +%s) ))
          echo "Dernière collecte lancée il y a $((age / 3600)) h."
          if [ "$age" -gt 18000 ]; then
            gh workflow run collect.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Collecte relancée."
          fi
